<style>

<script>
const r=String.raw;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=c=>esc(c).replace(/(%.*$)|('[^'\n]*')|\b(for|end|if|else|while|function|hold|on|off|figure|grid|close|all)\b|(\b\d+(?:\.\d+)?\b)|(@\([a-z]+\))/gm,(m,a,b,k,n,f)=>a?`<i class=c>${a}</i>`:b?`<i class=s>${b}</i>`:k?`<i class=k>${k}</i>`:n?`<i class=n>${n}</i>`:`<i class=f>${f}</i>`);
const code=c=>`<pre dir="ltr">${hl(c)}</pre>`;
/* ---------- plotting engine (SVG) ---------- */
const lin=(a,b,n)=>Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));
const DC=['#0072BD','#D95319','#EDB120','#7E2F8E','#77AC30','#4DBEEE','#A2142F'];
const CM={y:'#e6c800',m:'#ff00ff',c:'#00c8c8',r:'#ff0000',g:'#00c000',b:'#0000ff',k:'#000000'};
const DASH={'-':'','--':'9 6',':':'2 5','-.':'9 5 2 5'};
function ps(s){s=s||'';const m=s.match(/^([ymcrgbk])?(--|-\.|-|:)?([o+*.sd])?$/)||[];return{c:m[1]?CM[m[1]]:null,ls:m[2]||(m[3]?'':'-'),mk:m[3]||''}}
const L=(x,y,sp,lw,o)=>Object.assign({t:'l',x,y,lw:lw||1,mf:null},ps(sp),o||{});
function tex(s){s=s.replace(/\\(pi|omega|alpha|theta|Delta|circ)/g,(m,k)=>({pi:'π',omega:'ω',alpha:'α',theta:'θ',Delta:'Δ',circ:'°'}[k]));let o='',i=0;while(i<s.length){const c=s[i];if((c==='^'||c==='_')&&i+1<s.length){let b,n;if(s[i+1]==='{'){const j=s.indexOf('}',i);b=s.slice(i+2,j);n=j-i+1}else{b=s[i+1];n=2}o+=`<tspan baseline-shift="${c==='^'?'super':'sub'}" font-size="75%">${tex(b)}</tspan>`;i+=n}else{o+=esc(c);i++}}return o}
const fmt=v=>{let t=(+v.toFixed(6)).toString();return t==='-0'?'0':t};
function nice(lo,hi,n){n=n||6;if(lo===hi){lo-=1;hi+=1}const q=(hi-lo)/n,p=10**Math.floor(Math.log10(q)),f=q/p,st=(f<1.5?1:f<3?2:f<7?5:10)*p,a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(10));return t}
let uid=0;
function ranges(items){let xs=[],ys=[];items.forEach(i=>{if(i.t==='l'){xs.push(...i.x);ys.push(...i.y)}else if(i.t==='r'){xs.push(i.x0,i.x1);ys.push(i.y0,i.y1)}else if(i.t==='a'){xs.push(...i.x);ys.push(0,...i.y)}else if(i.t==='e'){xs.push(...i.x);i.y.forEach((v,k)=>ys.push(v-i.e,v+i.e))}});const f=a=>a.filter(isFinite);return[f(xs),f(ys)]}
function mkScale(lim,A,B,lg){const T=lg?Math.log10:(v=>v),a=T(lim[0]),b=T(lim[1]);return v=>A+(T(v)-a)/(b-a)*(B-A)}
function axis1(vals,lg,given){let lim,tk;if(lg){const a=Math.floor(Math.log10(Math.min(...vals.filter(v=>v>0)))),b=Math.ceil(Math.log10(Math.max(...vals)));lim=given||[10**a,10**b];tk=[];for(let k=Math.round(Math.log10(lim[0]));k<=Math.round(Math.log10(lim[1]));k++)tk.push(10**k)}else{const mn=Math.min(...vals),mx=Math.max(...vals),t=nice(mn,mx);lim=given||[t[0],t[t.length-1]];tk=nice(lim[0],lim[1]).filter(v=>v>=lim[0]-1e-9&&v<=lim[1]+1e-9)}return{lim,tk}}
function marker(m,x,y,c,f){const s=4.5;if(m==='o')return`<circle cx="${x}" cy="${y}" r="${s}" fill="${f||'none'}" stroke="${c}"/>`;if(m==='s')return`<rect x="${x-s}" y="${y-s}" width="${2*s}" height="${2*s}" fill="${f||'none'}" stroke="${c}"/>`;if(m==='d')return`<path d="M${x} ${y-s-1}L${x+s+1} ${y}L${x} ${y+s+1}L${x-s-1} ${y}Z" fill="none" stroke="${c}"/>`;if(m==='+')return`<path d="M${x-s} ${y}H${x+s}M${x} ${y-s}V${y+s}" stroke="${c}"/>`;if(m==='*')return`<path d="M${x-s} ${y}H${x+s}M${x} ${y-s}V${y+s}M${x-3} ${y-3}L${x+3} ${y+3}M${x-3} ${y+3}L${x+3} ${y-3}" stroke="${c}"/>`;return`<circle cx="${x}" cy="${y}" r="1.8" fill="${c}"/>`}
function drawItems(items,sx,sy,state){let o='';items.forEach(i=>{if(i.t==='l'){const c=i.c||DC[state.k++%7];i._c=c;let d='';i.x.forEach((xv,k)=>{const yv=i.y[k];if(!isFinite(yv)||!isFinite(xv)){return}d+=(d&&isFinite(i.y[k-1])?'L':'M')+sx(xv).toFixed(1)+' '+sy(yv).toFixed(1)});if(i.ls!==''&&d)o+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${i.lw*1.4}" stroke-dasharray="${DASH[i.ls]}"/>`;if(i.mk)i.x.forEach((xv,k)=>{o+=marker(i.mk,sx(xv),sy(i.y[k]),c,i.mf)})}else if(i.t==='r'){o+=`<rect x="${sx(i.x0)}" y="${sy(i.y1)}" width="${Math.max(0,sx(i.x1)-sx(i.x0)-(i.gap||0))}" height="${sy(i.y0)-sy(i.y1)}" fill="${i.f}" stroke="${i.s||'#fff'}" stroke-width="0.7"/>`}else if(i.t==='a'){let d=`M${sx(i.x[0])} ${sy(0)}`;i.x.forEach((xv,k)=>d+=`L${sx(xv).toFixed(1)} ${sy(i.y[k]).toFixed(1)}`);d+=`L${sx(i.x[i.x.length-1])} ${sy(0)}Z`;o+=`<path d="${d}" fill="${i.f}"/>`;i._c=i.f}else if(i.t==='e'){const c=i.c||'#000';i.x.forEach((xv,k)=>{const a=sy(i.y[k]-i.e),b=sy(i.y[k]+i.e),X=sx(xv);o+=`<path d="M${X} ${a}V${b}M${X-5} ${a}H${X+5}M${X-5} ${b}H${X+5}" stroke="${c}"/>`;if(i.mk)o+=marker(i.mk,X,sy(i.y[k]),c,i.mf)});i._c=c}else if(i.t==='tx'){o+=`<text x="${sx(i.x)}" y="${sy(i.y)}" text-anchor="middle" font-size="12" fill="#222">${esc(i.s)}</text>`}});return o}
function panel(sp,X0,Y0,W0,H0){
 const ml=52,mr=sp.yy?52:16,mt=sp.ttl?32:14,mb=sp.xl?42:28;let X=X0+ml,Y=Y0+mt,W=W0-ml-mr,H=H0-mt-mb;
 if(sp.polar)return polar(sp,X0,Y0,W0,H0);
 const lg=sp.log||'',lx=lg.includes('x'),ly=lg.includes('y'),[xs,ys]=ranges(sp.items);
 const ax=axis1(xs,lx,sp.xlim),ay=axis1(ys,ly,sp.ylim);
 if(sp.eq){const rx=ax.lim[1]-ax.lim[0],ry=ay.lim[1]-ay.lim[0],k=Math.min(W/rx,H/ry),nw=k*rx,nh=k*ry;X+=(W-nw)/2;Y+=(H-nh)/2;W=nw;H=nh}
 const sx=mkScale(ax.lim,X,X+W,lx),sy=mkScale(ay.lim,Y+H,Y,ly),id='cp'+(uid++),st={k:0};let o=`<clipPath id="${id}"><rect x="${X}" y="${Y}" width="${W}" height="${H}"/></clipPath><rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="#fff"/>`;
 const xt=sp.xtk||ax.tk;
 xt.forEach(v=>{const x=sx(v);if(sp.grid)o+=`<path d="M${x} ${Y}V${Y+H}" stroke="#dcdcdc"/>`;o+=`<path d="M${x} ${Y+H}v-4" stroke="#262626"/><text x="${x}" y="${Y+H+16}" text-anchor="middle" font-size="12" fill="#262626">${lx?'10<tspan baseline-shift="super" font-size="75%">'+Math.round(Math.log10(v))+'</tspan>':(sp.xt?esc(sp.xt[v-1]):fmt(v))}</text>`});
 ay.tk.forEach(v=>{const y=sy(v);if(sp.grid)o+=`<path d="M${X} ${y}H${X+W}" stroke="#dcdcdc"/>`;o+=`<path d="M${X} ${y}h4" stroke="#262626"/><text x="${X-6}" y="${y+4}" text-anchor="end" font-size="12" fill="${sp.yy?DC[0]:'#262626'}">${ly?'10<tspan baseline-shift="super" font-size="75%">'+Math.round(Math.log10(v))+'</tspan>':fmt(v)}</text>`});
 o+=`<g clip-path="url(#${id})">${drawItems(sp.items,sx,sy,st)}</g>`;
 if(sp.yy){const R=sp.yy,[,y2]=ranges(R.items),a2=axis1(y2,false,R.ylim),s2=mkScale(a2.lim,Y+H,Y,false),s3={k:1};o+=`<g clip-path="url(#${id})">${drawItems(R.items,sx,s2,s3)}</g>`;a2.tk.forEach(v=>{o+=`<text x="${X+W+6}" y="${s2(v)+4}" font-size="12" fill="${DC[1]}">${fmt(v)}</text>`});o+=`<text transform="translate(${X+W+42} ${Y+H/2}) rotate(90)" text-anchor="middle" font-size="13" fill="${DC[1]}">${tex(R.yl)}</text>`}
 o+=`<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="#262626"/>`;
 if(sp.ttl)o+=`<text x="${X+W/2}" y="${Y-10}" text-anchor="middle" font-size="${sp.tfs||13}" font-weight="700" fill="#111">${tex(sp.ttl)}</text>`;
 if(sp.xl)o+=`<text x="${X+W/2}" y="${Y+H+36}" text-anchor="middle" font-size="13" fill="#111">${tex(sp.xl)}</text>`;
 if(sp.yl)o+=`<text transform="translate(${X-38} ${Y+H/2}) rotate(-90)" text-anchor="middle" font-size="13" fill="${sp.yy?DC[0]:'#111'}">${tex(sp.yl)}</text>`;
 if(sp.leg){const its=sp.items.filter(i=>i.t==='l'||i.t==='e'||i.t==='a').slice(0,sp.leg.length),w=Math.max(...sp.leg.map(s=>s.length))*6.6+46,h=its.length*18+8,lx0=sp.legpos==='nw'?X+8:X+W-w-8,ly0=Y+8;o+=`<rect x="${lx0}" y="${ly0}" width="${w}" height="${h}" fill="#fffffff0" stroke="#999"/>`;its.forEach((i,k)=>{const y=ly0+16+k*18,c=i._c||'#000';o+=`<path d="M${lx0+6} ${y-4}h22" stroke="${i.t==='a'?i.f:c}" stroke-width="${i.t==='a'?6:1.6}" stroke-dasharray="${i.t==='l'?DASH[i.ls]:''}"/>`;if(i.mk)o+=marker(i.mk,lx0+17,y-4,c,i.mf);o+=`<text x="${lx0+34}" y="${y}" font-size="12" fill="#111">${tex(sp.leg[k])}</text>`})}
 return o}
function polar(sp,X0,Y0,W0,H0){const cx=X0+W0/2,cy=Y0+H0/2+8,R=Math.min(W0,H0)/2-30;let o='';for(let k=1;k<=5;k++)o+=`<circle cx="${cx}" cy="${cy}" r="${R*k/5}" fill="none" stroke="#d0d0d0"/><text x="${cx+3}" y="${cy-R*k/5+11}" font-size="10" fill="#555">${fmt(k/5)}</text>`;for(let a=0;a<360;a+=30){const t=a*Math.PI/180;o+=`<path d="M${cx} ${cy}L${cx+R*Math.cos(t)} ${cy-R*Math.sin(t)}" stroke="#d0d0d0"/><text x="${cx+(R+16)*Math.cos(t)}" y="${cy-(R+16)*Math.sin(t)+4}" text-anchor="middle" font-size="12" fill="#222">${a}°</text>`}let d='';sp.th.forEach((t,i)=>{const r=sp.r[i];d+=(i?'L':'M')+(cx+R*r*Math.cos(t)).toFixed(1)+' '+(cy-R*r*Math.sin(t)).toFixed(1)});o+=`<path d="${d}" fill="none" stroke="${DC[0]}" stroke-width="1.8"/>`;if(sp.ttl)o+=`<text x="${X0+W0/2}" y="${Y0+16}" text-anchor="middle" font-size="14" font-weight="700" fill="#111">${tex(sp.ttl)}</text>`;return o}
function fig(specs,m,n){m=m||1;n=n||1;const W=680,H=m>1?520:400;let o='';specs.forEach((s,i)=>{o+=panel(s,(i%n)*W/n,Math.floor(i/n)*H/m,W/n,H/m)});return`<div class="fig"><div class="bar">Figure 1</div><svg viewBox="0 0 ${W} ${H}" font-family="Helvetica,Arial,sans-serif"><rect width="${W}" height="${H}" fill="#f4f4f4"/>${o}</svg></div>`}
/* ---------- data helpers ---------- */
let seed=0;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const randn=()=>Math.sqrt(-2*Math.log(1-rnd()))*Math.cos(2*Math.PI*rnd());
const P=Math.PI,sin=Math.sin,cos=Math.cos,exp=Math.exp;
/* ---------- examples ---------- */
const E={};
E[4]={sec:'القسم الثاني: الأوامر الأساسية',h:'الأمر الأساسي plot وأول رسمة',intro:'<p>الصيغة: <code>plot(x, y)</code> حيث <code>x</code> و <code>y</code> متجهان بنفس الطول تماماً.</p><p class="mut">مثال تطبيقي أول: موجة جيب التمام.</p>',
bug:r`x = linspace(0, 1, 101);
y = 5cos(3*pi*x);
plot(x, y)`,fix:r`x = linspace(0, 1, 101);
y = 5*cos(3*pi*x);
plot(x, y)
xlabel('x'); ylabel('y = 5cos(3\pix)');
title('A cosine wave'); grid on`,
why:'نسيت علامة الضرب <code>*</code> بين الرقم 5 ودالة <code>cos</code>. ماتلاب مش بيفهم 5cos زي الرياضيات، لازم تكتب 5*cos.',err:'Invalid expression. Check for missing multiplication operator, missing or unbalanced delimiters, or other syntax error.',
fixFn:()=>{const x=lin(0,1,101);return fig([{items:[L(x,x.map(v=>5*cos(3*P*v)))],xl:'x',yl:'y = 5cos(3\\pix)',ttl:'A cosine wave',grid:1}])}};
E[11]={sec:'القسم الثالث: تنسيق الجراف وتعدد الرسومات',h:'مثال محلول: منحنيات شيبيشيف Chebyshev',intro:'<p>رسم <code>T_j(x) = cos(j·acos(x))</code> للرتب 1 و3 و5 و7 على الفترة <code>[-1, 1]</code> باستخدام لوب.</p>',
bug:r`x = linspace(-1, 1, 400);
figure;
for j = [1 3 5 7]
    plot(x, cos(j*acos(x)), 'LineWidth', 1.3)
end
grid on; xlabel('x'); ylabel('T_j(x)');
title('Chebyshev polynomials');
legend('j = 1', 'j = 3', 'j = 5', 'j = 7', 'Location', 'best')`,
fixFn0:b=>b.replace('figure;','figure; hold on').replace('end\ngrid on','end\nhold off\ngrid on'),
why:'نسيت <code>hold on</code> قبل اللوب، فكل <code>plot</code> بتمسح اللي قبلها ولا يفضل غير منحنى <code>j = 7</code>. الحل: <code>hold on</code> قبل اللوب و<code>hold off</code> بعده.',
err:'Warning: Ignoring extra legend entries.   (مفيش error، بس الرسمة غلط: منحنى واحد بس)',
chebs:()=>{const x=lin(-1,1,400);return[1,3,5,7].map(j=>L(x,x.map(v=>cos(j*Math.acos(v))),'',1.3))},
fixFn(){return fig([{items:this.chebs(),grid:1,xl:'x',yl:'T_j(x)',ttl:'Chebyshev polynomials',leg:['j = 1','j = 3','j = 5','j = 7'],xlim:[-1,1]}])},
wrongFn(){const x=lin(-1,1,400);return fig([{items:[L(x,x.map(v=>cos(7*Math.acos(v))),'',1.3)],grid:1,xl:'x',yl:'T_j(x)',ttl:'Chebyshev polynomials',leg:['j = 1'],xlim:[-1,1]}])}};
E[13]={sec:'القسم الرابع: Figure و subplot و fplot',h:'رسم الدوال مباشرة بأمر fplot',intro:'<p>لو معاك دالة رياضية ومش عايز تحسب متجه نقاط بنفسك، <code>fplot</code> بيختار النقاط أوتوماتيك ويكثفها في الأماكن اللي الدالة بتتغير فيها بسرعة. الصيغة: <code>fplot(@(t) fun, [tmin tmax])</code>.</p>',
bug:r`fplot(@(x) exp(-0.2*x)*sin(3*x), [0 10])
grid on; title('A damped oscillation')`,fixFn0:b=>b.replace(')*sin',').*sin'),
why:'نسيت النقطة في ضرب الدالتين: لازم <code>.*</code> جوه <code>fplot</code> عشان الدالة تتحسب على متجه كامل.',
err:"Warning: Function behaves unexpectedly on array inputs. To improve performance, properly vectorize your function to return an output with the same size and shape as the input arguments.   (حسب إصدار ماتلاب: الرسمة بتظهر لكن أبطأ، أو تطلع error)",
fixFn:()=>{const x=lin(0,10,800);return fig([{items:[L(x,x.map(v=>exp(-0.2*v)*sin(3*v)))],grid:1,ttl:'A damped oscillation',xlim:[0,10]}])}};
E[14]={sec:'القسم الرابع: Figure و subplot و fplot',h:'تقسيم الشاشة بأمر subplot',intro:'<p><code>subplot(m, n, p)</code>: <code>m</code> عدد الصفوف، <code>n</code> عدد الأعمدة، و<code>p</code> مكان الرسمة الحالية (العد بيبدأ بالصفوف). شبكة 2×2 لأربع دوال:</p>',

figure

subplot(2,2,4); plot(x, exp(-x.^2));title('e^{-x^2}');  grid on`,fixFn0:b=>b.replace('1/(1+x^2));','1./(1+x.^2));'),
why:'في الرسمة الأولى كتبت <code>1/(1+x^2)</code> من غير نقط. التصحيح <code>1./(1+x.^2)</code> عشان العمليات تتنفذ عنصر عنصر.',err:"Error using ^ \nIncorrect dimensions for raising a matrix to a power. Check that the matrix is square and the power is a scalar. To perform elementwise matrix powers, use '.^'.",
fixFn:()=>{const x=lin(-5,5,200),g=(t,f,o)=>Object.assign({items:[L(x,x.map(f))],ttl:t,grid:1,xlim:[-5,5]},o||{});return fig([g('1/(1+x^2)',v=>1/(1+v*v)),g('sin x',sin),g('x^3',v=>v**3),g('e^{-x^2}',v=>exp(-v*v))],2,2)}};

E[22]={sec:'القسم السادس: أمثلة محلولة',h:'Example 6.6: المدرج التكراري (Histogram & sprintf)',intro:'<p>ولّد 5000 قيمة من توزيع طبيعي (متوسط 50، انحراف 8) واعرضها في 30 سلة، واطبع المتوسط والانحراف في العنوان.</p>',
bug:r`rng(0)
x = 50 + 8*randn(1, 5000);
histogram(x, 30)
xlabel('Value'); ylabel('Frequency')
title(sprintf('mean = %.2f, std = %.2f', mean(x)))`,fixFn0:b=>b.replace('mean(x)))','mean(x), std(x)))'),
why:'حجزنا مكانين <code>%.2f</code> في <code>sprintf</code> لكن بعتنا متغير واحد بس <code>mean(x)</code>. مفيش error، لكن العنوان بيتقطع عند المكان التاني. الحل: <code>mean(x), std(x)</code>.',err:'مفيش رسالة خطأ: العنوان بيطلع ناقص (std = ) بس.',
data(){seed=0;const x=Array.from({length:5000},()=>50+8*randn()),m=x.reduce((a,b)=>a+b)/5000,s=Math.sqrt(x.reduce((a,b)=>a+(b-m)**2,0)/4999),mn=Math.min(...x),mx=Math.max(...x),w=(mx-mn)/30,c=Array(30).fill(0);x.forEach(v=>c[Math.min(29,Math.floor((v-mn)/w))]++);return{m,s,it:c.map((v,i)=>({t:'r',x0:mn+i*w,x1:mn+(i+1)*w,y0:0,y1:v,f:'#0072BD',s:'#fff'}))}},
fixFn(){const d=this.data();return fig([{items:d.it,xl:'Value',yl:'Frequency',ttl:`mean = ${d.m.toFixed(2)}, std = ${d.s.toFixed(2)}`}])+'<p class="mut">الأعداد من مولّد عشوائي هنا، قريبة من ماتلاب لكن مش مطابقة لـ rng(0) بالظبط.</p>'},
wrongFn(){const d=this.data();return fig([{items:d.it,xl:'Value',yl:'Frequency',ttl:`mean = ${d.m.toFixed(2)}, std = `}])}};

errorbar(F, x, 0.3*ones(size(x)), 'ko', 'MarkerFaceColor', 'k');
p = polyfit(F, x, 1);
Ff = linspace(0.5, 5.5, 50);
plot(Ff, polyval(p, Ff), 'r-');
xlabel('Load F (N)'); ylabel('Extension x (cm)'); grid on

fit(){const F=[1,2,3,4,5],x=[2.1,3.9,6.2,7.8,10.1],mf=3,mx=x.reduce((a,b)=>a+b)/5,sl=F.reduce((a,f,i)=>a+(f-mf)*(x[i]-mx),0)/10,ic=mx-sl*mf;return{F,x,sl,ic,Ff:lin(0.5,5.5,50)}},

E[25]={sec:'القسم السادس: أمثلة محلولة',h:'Example 6.9: محوران رأسيان (yyaxis)',intro:'<p>ارسم درجة الحرارة (°C) والرطوبة النسبية (%) على مدار 24 ساعة في شكل واحد بمحورين رأسيين (يسار ويمين).</p><p class="mut">الكود هنا سليم. السؤال: إيه اللي يحصل لو استبدلنا <code>h = 0:23</code> بـ <code>h = 1:24</code> وسبنا <code>xlim([0 23])</code>؟</p>',

E[26]={sec:'القسم السادس: أمثلة محلولة',h:'Example 6.10: تظليل المساحة تحت المنحنى (area)',intro:'<p>ارسم <code>y = e^(−x²)</code> على <code>[-3, 3]</code> وظلّل المنطقة بين <code>x = −1</code> و<code>x = 1</code> بأمر <code>area</code>. (المساحة المظللة ≈ 1.4936)</p>',

Object.values(E).forEach(e=>{if(e.fixFn0&&e.fix===undefined)e.fix=e.fixFn0(e.bug)});
function exBlock(n,lvl){const e=E[n],id='x'+n;return`<h${lvl}>${e.h}</h${lvl}>${e.intro||''}<div class="bad"><div class="lbl">${e.sol?'الكود (اقرأه كويس):':'كود التحدي (فيه غلطة بيزكس Basics):'}</div>${code(e.bug)}</div>
<div class="btns"><button onclick="rv('${id}')">${e.sol?'اكشف الإجابة':'اكشف الغلطة والتصحيح'}</button><button class="alt" onclick="rn('${id}',${n})">تشغيل الكود وعرض الرسمة (Run &amp; Plot)</button></div>
<div id="${id}-r" hidden><div class="box err"><div class="lbl">${e.sol?'الإجابة:':'الغلطة:'}</div><p>${e.why}</p></div>${e.fix?`<div class="box ok"><div class="lbl">الكود السليم:</div>${code(e.fix)}</div>`:''}</div><div id="${id}-p" hidden></div>`}
const TAG='<span class="tag">المرحلة الثانية: التطبيق العملي</span>';
function exSlide(n){return TAG+exBlock(n,2)}
