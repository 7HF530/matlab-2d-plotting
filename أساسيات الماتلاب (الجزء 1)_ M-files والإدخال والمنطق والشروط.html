<script>
const r=String.raw;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=c=>esc(c).replace(/(%.*$)|('[^'\n]*')|\b(if|else|elseif|switch|case|otherwise|while|for|end|break|function|true|false)\b|(\b\d+(?:\.\d+)?\b)/gm,(m,a,b,k,n)=>a?`<i class=c>${a}</i>`:b?`<i class=s>${b}</i>`:k?`<i class=k>${k}</i>`:`<i class=n>${n}</i>`);
const code=c=>`<pre dir="ltr">${hl(c)}</pre>`;
const SECN=['القسم الأول: M-Files وأساسيات الإدخال والإخراج','القسم الثاني: العوامل العلائقية والمنطقية','القسم الثالث: الجمل الشرطية','القسم الرابع: الحلقات (Loops)','القسم الخامس: أمثلة محلولة وتمارين'];
const L=(t,pts,c,n,x)=>({k:'l',t,pts,c,n,x});
const C=(t,idea,bug,why,fix,n)=>({k:'c',t,idea,bug,why,fix,n});
const X=(t,q,a,ac,n,qc)=>({k:'x',t,q,a,ac,n,qc});
const tb=(h,rows)=>`<table><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr>${rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</table>`;
const S1=[
L('خريطة الجزء الأول: من الـ M-file لحد الشروط',['<b>القسم 1:</b> الـ M-files والإدخال والإخراج.','<b>القسم 2:</b> العوامل العلائقية والمنطقية.','<b>القسم 3:</b> الجمل الشرطية <code>if</code> و<code>switch</code> والفهرسة المنطقية.','<b>القسم 4:</b> الحلقات <code>for</code> و<code>while</code>. (في الجزء التاني).','<b>القسم 5:</b> أمثلة محلولة: فيبوناتشي والأعداد الأولية والتنصيف والترتيب. (في الجزء التاني).'],r`clc; clear;
x = input('Enter x: ');
if x > 0
    fprintf('%.1f is positive\n', x);
end`,'ابدأ بسؤال: مين كتب كود طويل في الـ Command Window وضاع منه؟ وضّح إن الرحلة كلها بتتبني على فكرة: الكود بياخد قرار ويكرر.'),
L('السكريبت مقابل الدالة (Script vs Function)',['<b>السكريبت</b>: أوامر ورا بعض بتشتغل على متغيرات الـ Workspace، وبتشغّله باسمه.','<b>الدالة</b>: بتاخد مدخلات وترجّع مخرجات، ومتغيراتها <b>محلية</b> (Local).','السكريبت بيحل مشكلة متكاملة، والدالة أداة صغيرة بتستخدمها كتير.'],r`% lab1.m  (سكريبت)
R = 5;
A = pi*R^2

% circle_area.m  (دالة)
function A = circle_area(R)
    A = pi*R^2;
end`,'ركّز إن الدالة مبتشوفش متغيرات الـ Workspace ولا بتسيّب متغيراتها فيه. اطلب منهم يتوقعوا إيه هيحصل لو غيّروا R جوه الدالة.'),
L('تشريح ملف الدالة',['السطر الأول: <code>function [المخرجات] = الاسم(المدخلات)</code>.','اسم الملف لازم يطابق اسم الدالة: <code>sumprod.m</code>.','لازم تدّي قيمة لكل مخرج قبل ما الدالة تخلص.','التعليق اللي تحت السطر الأول بيظهر مع <code>help sumprod</code>.'],r`function [s, p] = sumprod(a, b)
% SUMPROD returns the sum and product of a and b
    s = a + b;
    p = a * b;
end

% الاستدعاء:
[s, p] = sumprod(3, 4)     % s = 7 , p = 12`,'اعرض خطأ شائع: ملف اسمه ahmed.m وفيه دالة اسمها test. ماتلاب بيستخدم اسم الملف.'),
L('تنضيف البيئة: clc و clear',['<code>clc</code> بيمسح شاشة الـ Command Window بس.','<code>clear</code> بيمسح كل المتغيرات من الذاكرة، و<code>clear x</code> بيمسح x بس.','<code>close all</code> بيقفل كل نوافذ الرسم.','اكتبهم في أول سطور أي سكريبت.'],r`clc          % امسح الشاشة
clear        % امسح كل المتغيرات
close all    % اقفل النوافذ
R = 5;
A = pi*R^2`,'اربطها بتجربة معمل: لو نسيت clear ممكن تستخدم قيمة قديمة من تجربة سابقة بصمت.'),
L('أخذ بيانات من المستخدم: input للأرقام',['<code>input</code> بيعرض رسالة وبيستنى المستخدم يكتب رقم.','لازم الناتج يتخزن في متغير على <b>الشمال</b> من علامة <code>=</code>.','المستخدم ممكن يكتب متجه زي <code>[1 2 3]</code>.'],r`I = input('Enter Current (A): ');
V = input('Enter Voltage (V): ');
R = V/I
v = input('Enter vector: ');    % اكتب [1 2 3]`,'خلّي طالب يشغل الكود ويجرب يكتب متجه بدل رقم عشان يشوفوا إن input بتقبل تعبيرات ماتلاب.'),
L('أخذ نصوص: input مع \'s\'',['لو عايز نص (اسم، اختيار) ضيف <code>\'s\'</code> كمعامل تاني.','من غير <code>\'s\'</code> ماتلاب بيحاول يفهم اللي اتكتب كتعبير رياضي.','حتى الرقم مع <code>\'s\'</code> بيتخزن كنص: حوّله بـ <code>str2double</code>.','قارن النصوص بـ <code>strcmp</code> مش <code>==</code>.'],r`name = input('Name: ', 's');
x = str2double(input('Number: ', 's'));
ans1 = input('Continue (yes/no)? ', 's');
if strcmp(ans1, 'yes')
    disp('OK')
end`,'اسأل: ليه strcmp مش ==؟ (لأن == بيقارن حرف حرف وبيفشل لو الطول مختلف).'),
L('عرض النتائج: disp',['<code>disp</code> بيعرض قيمة أو نص بسرعة.','مفيش تحكم في عدد الأرقام العشرية.','لدمج نص مع رقم استخدم <code>[ ]</code> مع <code>num2str</code>.'],r`x = 25;
disp(x)             % 25
disp('Hello')       % Hello
disp([1 2 3])       % 1 2 3
disp(pi)            % 3.1416`,'وضّح إن disp مناسب للمراجعة السريعة، لكن التقارير الهندسية محتاجة fprintf.'),
L('الطباعة المنسقة: fprintf',['<code>%d</code> عدد صحيح، <code>%f</code> رقم كسري، <code>%.2f</code> رقمين بعد العلامة، <code>%s</code> نص.','<code>\\n</code> سطر جديد، و<code>\\t</code> مسافة Tab.','كل علامة <code>%</code> مكانها متغير بالترتيب.','لو بعت متجه، الفورمات بتتكرر على كل عناصره.'],r`V = 12.5; I = 0.25;
fprintf('V = %.1f V, I = %.2f A\n', V, I);   % V = 12.5 V, I = 0.25 A
fprintf('Name: %s\n', 'Ali');                  % Name: Ali
fprintf('%d ', [1 2 3]); fprintf('\n');        % 1 2 3`,'اعرض الفرق بين %f (6 أرقام) و%.2f. وأكد إن fprintf مبتنزلش سطر جديد لوحدها.'),
L('دمج الأرقام بالنصوص: num2str',['<code>num2str</code> بتحوّل رقم لنص.','<code>num2str(x, n)</code> بتحدد عدد الأرقام المعنوية.','الأقواس <code>[ ]</code> بتلزق النصوص جنب بعض.'],r`num2str(pi)            % '3.1416'
num2str(pi, 8)         % '3.1415927'
P = 25;
disp(['P = ', num2str(P), ' W'])     % P = 25 W
title(['Max = ', num2str(50)])`,'نبّه: ' + "'a' + 5" + ' بتجمع رياضياً ومش بتلزق نص. لازم num2str.'),
X('تمرين 1: برنامج التيار والقدرة','اكتب سكريبت يطلب من المستخدم الجهد V والمقاومة R، ويحسب التيار والقدرة، ويطبعهم بدقة رقمين عشريين.','لو V = 12 و R = 4 هيطبع <code>I = 3.00 A, P = 36.00 W</code>.',r`clc; clear;
V = input('Voltage (V): ');
R = input('Resistance (ohm): ');
I = V/R;
P = V*I;
fprintf('I = %.2f A, P = %.2f W\n', I, P);`,'سيبهم يحلوا 3 دقايق قبل ما تدوس إظهار الحل، وراجع إن clc و clear في الأول.')
];
const S2=[
L('العوامل العلائقية (Relational Operators)',['<code>&gt;</code> <code>&lt;</code> <code>&gt;=</code> <code>&lt;=</code> <code>==</code> و"لا يساوي" هي <code>~=</code> (مش <code>!=</code>).','النتيجة <code>1</code> (True) أو <code>0</code> (False) من نوع <b>logical</b>.','على المتجهات بتشتغل عنصر عنصر.'],r`x = 7;
x > 5      % 1
x < 5      % 0
x >= 7     % 1
x ~= 7     % 0
[1 5 9] > 4          % 0 1 1
class(x > 5)         % 'logical'`,'اسأل: إيه الفرق بين 0 المنطقية و0 العادية؟ وأكد إن النتايج بتتحط في if مباشرة.'),
C('خطأ شائع: = مقابل ==','<code>=</code> للتخصيص (حط القيمة)، و<code>==</code> للمقارنة (اسأل: متساويين؟).',r`V = 220;
if V = 220
    disp('Normal voltage')
end`,'استخدام <code>=</code> جوه <code>if</code> بيوقف الكود: <code>Incorrect use of \'=\' operator. To assign a value to a variable, use \'=\'. To compare values for equality, use \'==\'.</code>',r`V = 220;
if V == 220
    disp('Normal voltage')
end`,'أكتر غلطة في أول معمل. خلّيهم يقرأوا رسالة الخطأ بصوت عالي.'),
L('العوامل المنطقية: & و | و ~',['<code>&</code> (AND): الاتنين لازم يتحققوا.','<code>|</code> (OR): واحد على الأقل يتحقق.','<code>~</code> (NOT): بيعكس. و<code>xor(a,b)</code> صح لو واحد بس صح.','بتشتغل على المتجهات عنصر عنصر.'],r`x = 15;
(x > 10) & (x < 20)     % 1
(x < 10) | (x > 12)     % 1
~(x > 10)               % 0
xor(true, true)         % 0
v = [5 12 20];
(v > 10) & (v < 18)     % 0 1 0`,'ارسم جدول الحقيقة على السبورة (4 صفوف) وخلّيهم يتوقعوا قبل ما تشغل الكود.'),
L('عوامل الاختصار: && و || ومتى نستخدمها',['<code>&&</code> و<code>||</code> للقيم <b>المفردة</b> بس، وبيوقفوا أول ما النتيجة تتحسم (Short-circuit).','ده بيحمي الكود: الشرط التاني مبيتحسبش لو الأول حسم النتيجة.','مع المصفوفات استخدم <code>&</code> و<code>|</code> (أو <code>all</code> و<code>any</code>).'],r`v = [];
if ~isempty(v) && v(1) > 0     % مفيش error: v(1) مبتتحسبش
    disp('First is positive')
end
b = 0; a = 10;
if b ~= 0 && a/b > 2
    disp('Ratio > 2')
end`,'وضّح إن && مع متجه بتدي error: Operands to the || and && operators must be convertible to logical scalar values.'),
L('ترتيب العمليات (Precedence)',['الأقواس، ثم القوى، ثم <code>~</code>، ثم <code>* /</code>، ثم <code>+ -</code>.','بعدها المقارنات <code>&lt; &gt; == ~=</code>.','بعدها <code>&</code>، وبعدها <code>|</code> (يعني <code>&</code> أقوى من <code>|</code>).','يعني: حساب ← مقارنة ← منطق. عند الشك استخدم الأقواس.'],r`3 + 4 < 2 * 5 & 7 > 6    % 1   (7<10) & (7>6)
1 | 0 & 0                    % 1   لأن 0&0 الأول
(1 | 0) & 0                  % 0
~(3 > 2) | (5 == 5) & (1 < 0)  % 0`,'خلّيهم يتدربوا يضيفوا الأقواس بإيديهم على التعبير الأخير خطوة بخطوة.'),
C('خطأ شائع: المقارنة المتسلسلة','في الرياضيات بنكتب <code>10 &lt; x &lt; 20</code>، لكن في الماتلاب لازم نقسمها لشرطين.',r`x = 5;
if 10 < x < 20
    disp('x is between 10 and 20')
end`,'مفيش error لكن الشرط <b>دايماً صح</b>: <code>(10 &lt; x)</code> بتطلع 0 أو 1، وبعدين بتتقارن بـ 20، و<code>0 &lt; 20</code> صح. فـ x = 5 هيطبع الرسالة غلط.',r`x = 5;
if x > 10 & x < 20
    disp('x is between 10 and 20')
end`,'غلطة صامتة، وده أخطر من اللي بيطلع error. شغّل الكود قدامهم بـ x = 5.'),
X('تمرين 2: احسب في دماغك','احسب نتيجة كل تعبير (0 أو 1):<br>أ) <code>~(3 > 2) | (5 == 5) &amp; (1 &lt; 0)</code><br>ب) <code>5 &gt; 3 &amp; 2 &gt; 4 | 1</code><br>ج) <code>xor(1, 1) | ~0</code>','أ) <b>0</b>: <code>(5==5)&amp;(1&lt;0)</code> = 0 والأولى 0.<br>ب) <b>1</b>: <code>(5&gt;3 &amp; 2&gt;4)</code> = 0، ثم <code>0 | 1</code> = 1.<br>ج) <b>1</b>: <code>xor(1,1)</code> = 0 و<code>~0</code> = 1.',r`~(3 > 2) | (5 == 5) & (1 < 0)   % 0
5 > 3 & 2 > 4 | 1                % 1
xor(1, 1) | ~0                   % 1`,'خلّيهم يكتبوا الأقواس الكاملة قبل الحل. اللي غلط غالباً نسي إن & أقوى من |.')
];
const S3=[
L('قاعدة if و else',['<code>if</code> بتنفذ الأوامر لو الشرط اتحقق، و<code>end</code> بتقفلها.','<code>else</code> مسار بديل وبتتكتب لوحدها من غير شرط.','قرار بمسار واحد (<code>if</code>) أو اتنين (<code>if-else</code>).'],r`mark = input('Mark: ');
if mark >= 50
    disp('Pass')
else
    disp('Fail')
end`,'نبّه إن الإزاحة (Indentation) مش إجبارية لكنها بتفرق في القراءة. استخدم Ctrl+I في المحرر.'),
L('قاعدة if-elseif-else: أول شرط صحيح بس',['للمسارات المتعددة.','الماتلاب بيجرّب الشروط بالترتيب وبينفذ <b>أول</b> شرط صحيح فقط ويتخطى الباقي.','<code>else</code> الأخيرة اختيارية وبتصطاد باقي الحالات.'],r`mark = 90;
if mark >= 85
    disp('A')            % دي اللي هتتنفذ
elseif mark >= 65
    disp('B')            % حتى لو 90 >= 65 صح، مش هتتنفذ
else
    disp('C')
end`,'أكّد النقطة: 90 بيحقق شرطين لكن بينفذ واحد بس. ده أساس الغلطة اللي بعدها.'),
C('خطأ شائع: ترتيب الشروط','لازم نرتب الشروط من الأكبر للأصغر (أو من الأضيق للأوسع).',r`mark = 90;
if mark >= 50
    disp('C')
elseif mark >= 85
    disp('A')
end`,'الدرجة 90 بتحقق <code>mark &gt;= 50</code> فيطبع <b>C</b> ويخرج، ومش هيوصل لشرط الـ A.',r`mark = 90;
if mark >= 85
    disp('A')
elseif mark >= 50
    disp('C')
end`,'اسألهم: لو الدرجة 60 هيطبع إيه في الكود الغلط؟ (C) وفي الصح؟ (C).'),
L('جملة switch: الشكل العام',['بديل أنظف لـ <code>if</code> لما تقارن متغير بقيم محددة.','<code>case</code> لكل قيمة، و<code>otherwise</code> لباقي الحالات.','<code>case {2, 3}</code> لأكتر من قيمة في نفس الـ case.'],r`day = 6;
switch day
    case 1
        disp('Sunday')
    case {6, 7}
        disp('Weekend')
    otherwise

'المدى بينقسم على 2 كل لفة. التتبع:'+tb(['لفة','a','b','c','f(c)'],[[1,1,2,1.5,0.25],[2,1,1.5,1.25,-0.4375],[3,1.25,1.5,1.375,-0.109375],[4,1.375,1.5,1.4375,0.0664]])+'ومن المحاكاة بتاخد <b>19 لفة</b> تقريباً لحد تفاوت 1e-6 (لأن 2<sup>-20</sup> ≈ 1e-6).',
r`k = 0;
a = 1; b = 2;
while (b - a)/2 > 1e-6
    c = (a + b)/2;
    if f(a)*f(c) < 0
        b = c;
    else
        a = c;
    end
    k = k + 1;
end
disp(k)       % 19`,'اربطه بالكفاءة: كل لفة بتكسب رقم عشري تقريباً. ممتاز للمقارنة مع طرق تانية.'),
L('مثال محلول 4: الترتيب بالفقاعات (Bubble Sort)',['بنقارن كل عنصرين متجاورين وبنبدّلهم لو كانوا بالعكس.','بعد كل مرور (Pass) أكبر عنصر بيوصل مكانه الأخير.','نحتاج <code>n-1</code> مرور، وحلقة داخلية بتقصر مع كل مرور.','التبديل بيحتاج متغير مؤقت <code>tmp</code>.'],r`v = [5 2 9 1];
n = length(v);
for pass = 1:n-1
    for k = 1:n-pass
        if v(k) > v(k+1)
            tmp = v(k);
            v(k) = v(k+1);
            v(k+1) = tmp;
        end
    end
end
disp(v)       % 1 2 5 9`,'نفّذ على السبورة بالمقارنات. اسأل: ليه مفيش داعي نقارن آخر عنصر بعد المرور الأول؟'),
X('تتبع وتمرين: الترتيب بالفقاعات','تتبّع المتجه <code>[5 2 9 1]</code> بعد كل مرور، وبعدين عدّل الكود يرتب تنازلياً.',
'التتبع:'+tb(['المرور','المتجه بعده'],[['البداية','5 2 9 1'],['1','2 5 1 9'],['2','2 1 5 9'],['3','1 2 5 9']])+'للترتيب التنازلي بنعكس علامة المقارنة: <code>v(k) &lt; v(k+1)</code>.',
r`% تنازلي
for pass = 1:n-1
    for k = 1:n-pass
        if v(k) < v(k+1)        % عكس المقارنة
            tmp = v(k); v(k) = v(k+1); v(k+1) = tmp;
        end
    end
end
% للمقارنة: sort(v, 'descend')`,'وضّح إن sort جاهزة أسرع بكتير، لكن فهم الخوارزمية مهم للمنطق. اسأل: إيه التعقيد؟ (n² تقريباً).'),
L('الخلاصة والخطوة الجاية',['<b>M-files</b>: سكريبت للمشكلة الكاملة، ودالة لأداة قابلة لإعادة الاستخدام.','<b>الإدخال والإخراج</b>: <code>input</code> و<code>disp</code> و<code>fprintf</code> و<code>num2str</code>.','<b>الشروط</b>: <code>if</code> بترتيب صحيح، <code>switch</code> بالمساواة، والأقنعة بدل الحلقات.','<b>الحلقات</b>: <code>for</code> لعدد معروف، <code>while</code> لشرط، مع <code>break</code> و<code>continue</code>.','<b>القاعدة الذهبية</b>: تتبّع الكود بإيدك، والمتجه أحسن لو ينفع.'],r`% تحدّي ختامي: اطبع مجموع الأعداد الأولية أقل من 50
total = 0;
for n = 2:49
    if isprime(n)
        total = total + n;
    end
end
disp(total)     % 328`,'اطلب منهم يتوقعوا الناتج. (مجموع الأعداد الأولية أقل من 50 = 328). وشجعهم يجربوا الأمثلة على جهازهم.')
];
const D=[];[S1,S2,S3].forEach((arr,si)=>arr.forEach(d=>{d.s=si;D.push(d)}));
const deck=document.getElementById('deck');
D.forEach((d,i)=>{const s=document.createElement('section');s.className='slide';
let h=`<span class="tag">${SECN[d.s]}</span><span class="num">الشريحة ${i+1} من ${D.length}</span><h2>${d.t}</h2>`;
if(d.k==='l')h+=`<div class="cols"><div class="card"><h3>الشرح</h3><ul>${d.pts.map(p=>'<li>'+p+'</li>').join('')}</ul>${d.x||''}</div><div class="card"><h3>الكود</h3>${code(d.c)}</div></div>`;
else if(d.k==='c')h+=`<div class="cols"><div class="card"><h3>الشرح</h3><p>${d.idea}</p></div><div class="card bad"><h3>كود فيه خطأ شائع</h3>${code(d.bug)}<button onclick="const x=this.nextElementSibling;x.hidden=!x.hidden;this.textContent=x.hidden?'إظهار الخطأ / التصحيح':'إخفاء التصحيح'">إظهار الخطأ / التصحيح</button><div hidden><div class="box err"><div class="lbl">الخطأ وسببه:</div><p>${d.why}</p></div><div class="box ok"><div class="lbl">الكود الصحيح:</div>${code(d.fix)}</div></div></div></div>`;
else h+=`<div class="card"><h3>التمرين</h3><p>${d.q}</p><button onclick="const x=this.nextElementSibling;x.hidden=!x.hidden;this.textContent=x.hidden?'إظهار الحل':'إخفاء الحل'">إظهار الحل</button><div hidden><div class="box ok"><div class="lbl">الحل:</div><p>${d.a}</p>${code(d.ac)}</div></div></div>`;
s.innerHTML=h;deck.appendChild(s)});
const sl=[...deck.children];let cur=0;
function go(n){cur=Math.max(0,Math.min(sl.length-1,n));sl.forEach((s,i)=>s.classList.toggle('on',i===cur));sl[cur].scrollTop=0;document.getElementById('ct').textContent=(cur+1)+' / '+sl.length;document.querySelector('#pg i').style.width=((cur+1)/sl.length*100)+'%'}
document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('pv').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft'||k==='PageDown')go(cur+1);else if(k==='ArrowRight'||k==='PageUp')go(cur-1);else if(k==='Home')go(0);else if(k==='End')go(sl.length-1)});
go(0);
</script></body></html>
